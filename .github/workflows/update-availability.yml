name: Update availability

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install node-ical

      - name: Update availability section
        run: node scripts/update-availability.js
        env:
          CAL_ICS_ESTUDIO1: ${{ secrets.CAL_ICS_ESTUDIO1 }}
          CAL_ICS_ESTUDIO2: ${{ secrets.CAL_ICS_ESTUDIO2 }}
          CAL_ICS_ESTUDIO3: ${{ secrets.CAL_ICS_ESTUDIO3 }}
          CAL_ICS_ESTUDIO4: ${{ secrets.CAL_ICS_ESTUDIO4 }}

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Actualizar disponibilidad [automatizado]"
            git push
          else
            echo "Sin cambios."
          fi
